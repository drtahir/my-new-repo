name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: false

      - name: Regenerate Android wrapper completely
        run: |
          # Delete ALL existing gradle wrapper files
          rm -rf bc_project/android/gradle
          rm -f bc_project/android/gradlew
          rm -f bc_project/android/gradlew.bat

          # Let Flutter regenerate them from scratch
          cd bc_project
          flutter build apk --debug 2>/dev/null || true

          # Now fix the JVM opts in the freshly generated gradlew
          python3 << 'PYEOF'
          import re, os
          path = 'android/gradlew'
          if os.path.exists(path):
              content = open(path).read()
              content = re.sub(r"DEFAULT_JVM_OPTS=.*", "DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'", content)
              open(path, 'w').write(content)
              for line in content.split('\n'):
                  if 'DEFAULT_JVM_OPTS' in line:
                      print('PATCHED:', repr(line))
          else:
              print('gradlew not found at', path)
              import subprocess
              result = subprocess.run(['find', '.', '-name', 'gradlew'], capture_output=True, text=True)
              print('Found gradlew at:', result.stdout)
          PYEOF

          # Verify
          echo "=== gradlew JVM opts ==="
          grep "DEFAULT_JVM_OPTS" android/gradlew || echo "NOT FOUND"
          echo "=== jar exists ==="
          ls -lh android/gradle/wrapper/ || echo "NO WRAPPER DIR"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
