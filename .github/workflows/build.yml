name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties
          echo "flutter.versionCode=1" >> bc_project/android/local.properties
          echo "flutter.versionName=1.0.0" >> bc_project/android/local.properties

      - name: Fix Flutter gradlew and wrapper
        run: |
          echo "=== Finding all Flutter gradle files ==="
          find $FLUTTER_ROOT/bin/cache -name "gradle-wrapper.jar" 2>/dev/null
          find $FLUTTER_ROOT/bin/cache -name "gradle-wrapper.properties" 2>/dev/null
          find $FLUTTER_ROOT/bin/cache -name "gradlew" 2>/dev/null

          FLUTTER_WRAPPER_DIR=$(find $FLUTTER_ROOT/bin/cache -name "gradle-wrapper.jar" 2>/dev/null | head -1 | xargs dirname)
          FLUTTER_GRADLEW=$(find $FLUTTER_ROOT/bin/cache -name "gradlew" 2>/dev/null | head -1)

          echo "Wrapper dir: $FLUTTER_WRAPPER_DIR"
          echo "Gradlew: $FLUTTER_GRADLEW"

          # Write modern gradlew to Flutter cache
          cat > "$FLUTTER_GRADLEW" << 'GRADLEW'
#!/bin/sh
DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'
if [ -z "$JAVA_HOME" ]; then
  JAVACMD="java"
else
  JAVACMD="$JAVA_HOME/bin/java"
fi
SCRIPT_DIR=$(cd "$(dirname "$0")" && pwd)
CLASSPATH="$SCRIPT_DIR/gradle/wrapper/gradle-wrapper.jar"
exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEW
          chmod +x "$FLUTTER_GRADLEW"

          # Copy to project
          cp "$FLUTTER_GRADLEW" bc_project/android/gradlew
          chmod +x bc_project/android/gradlew

          # Copy jar and properties using discovered path
          mkdir -p bc_project/android/gradle/wrapper
          cp "$FLUTTER_WRAPPER_DIR/gradle-wrapper.jar" bc_project/android/gradle/wrapper/gradle-wrapper.jar

          # Write properties manually since path varies
          cat > bc_project/android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
PROPS

          echo "=== Verification ==="
          grep "DEFAULT_JVM_OPTS" bc_project/android/gradlew
          ls -lh bc_project/android/gradle/wrapper/
          cat bc_project/android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Run code generation
        working-directory: bc_project
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        working-directory: bc_project
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bc_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
