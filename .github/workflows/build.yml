name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Replace gradle wrapper completely
        run: |
          # Download official gradle 8.9 wrapper jar
          mkdir -p bc_project/android/gradle/wrapper

          curl -fsSL "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o /tmp/gradle.zip
          unzip -p /tmp/gradle.zip "gradle-8.9/lib/gradle-wrapper.jar" \
            > bc_project/android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || \
          curl -fsSL "https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar" \
            -o bc_project/android/gradle/wrapper/gradle-wrapper.jar

          echo "Jar size: $(wc -c < bc_project/android/gradle/wrapper/gradle-wrapper.jar)"

          # Write clean wrapper properties
          cat > bc_project/android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          networkTimeout=10000
          PROPS

          # Write brand new clean gradlew
          cat > bc_project/android/gradlew << 'GRADLEW'
          #!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=$(basename "$0")
          DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'
          MAX_FD=maximum
          warn() { echo "$*"; }
          die() { echo; echo "$*"; echo; exit 1; }
          if [ "$APP_BASE_NAME" = ".." ]; then die "ERROR: Invalid application base name '$APP_BASE_NAME'."; fi
          if [ -z "$JAVA_HOME" ]; then
            JAVACMD=java
          else
            JAVACMD="$JAVA_HOME/bin/java"
            if [ ! -x "$JAVACMD" ]; then die "ERROR: JAVA_HOME is set to '$JAVA_HOME', but \$JAVA_HOME/bin/java does not exist."; fi
          fi
          APP_HOME=$(cd "$(dirname "$0")" && pwd -P) || die "ERROR: Unable to determine current working directory."
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          exec "$JAVACMD" $DEFAULT_JVM_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW

          chmod +x bc_project/android/gradlew

          echo "=== gradlew ==="
          cat bc_project/android/gradlew
          echo "=== jar size ==="
          ls -lh bc_project/android/gradle/wrapper/

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
