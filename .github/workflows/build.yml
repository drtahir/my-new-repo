name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Patch gradlew and wrapper
        run: |
          # Fix JVM opts
          python3 << 'PYEOF'
          import re
          path = 'bc_project/android/gradlew'
          content = open(path).read()
          content = re.sub(
              r"DEFAULT_JVM_OPTS=.*",
              "DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'",
              content
          )
          open(path, 'w').write(content)
          for line in content.split('\n'):
              if 'DEFAULT_JVM_OPTS' in line:
                  print('PATCHED:', repr(line))
          PYEOF
          chmod +x bc_project/android/gradlew

          # Re-download wrapper jar to guarantee correct version
          curl -L "https://github.com/gradle/gradle/raw/v8.3.0/gradle/wrapper/gradle-wrapper.jar" \
            -o bc_project/android/gradle/wrapper/gradle-wrapper.jar
          
          # Verify jar
          ls -lh bc_project/android/gradle/wrapper/gradle-wrapper.jar
          echo "Jar size in bytes: $(wc -c < bc_project/android/gradle/wrapper/gradle-wrapper.jar)"

      - name: Verify setup
        run: |
          echo "=== gradlew JVM opts ==="
          grep "DEFAULT_JVM_OPTS" bc_project/android/gradlew
          echo "=== wrapper properties ==="
          cat bc_project/android/gradle/wrapper/gradle-wrapper.properties
          echo "=== jar size ==="
          ls -lh bc_project/android/gradle/wrapper/gradle-wrapper.jar

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
