name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Setup Gradle wrapper
        run: |
          JAR="bc_project/android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p bc_project/android/gradle/wrapper

          FLUTTER_JAR=$(find $FLUTTER_ROOT -name "gradle-wrapper.jar" 2>/dev/null | head -1)
          cp "$FLUTTER_JAR" "$JAR"
          cp "$(find $FLUTTER_ROOT -name "gradle-wrapper.properties" 2>/dev/null | head -1)" \
             bc_project/android/gradle/wrapper/gradle-wrapper.properties

          python3 << 'PYEOF'
          import re
          path = 'bc_project/android/gradlew'
          content = open(path).read()
          content = re.sub(r"DEFAULT_JVM_OPTS=.*", "DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'", content)
          open(path, 'w').write(content)
          PYEOF
          chmod +x bc_project/android/gradlew

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Run code generation
        working-directory: bc_project
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Debug - find what gradlew Flutter actually uses
        working-directory: bc_project
        run: |
          echo "=== CWD ==="
          pwd
          echo "=== android/gradlew exists? ==="
          ls -la android/gradlew
          echo "=== android/gradlew content ==="
          cat android/gradlew
          echo "=== android/gradle/wrapper/ ==="
          ls -lh android/gradle/wrapper/
          echo "=== Run gradlew directly to test ==="
          cd android && ./gradlew --version 2>&1 | head -20

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug --verbose 2>&1 | head -50

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
