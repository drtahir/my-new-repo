name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Patch all gradlew files
        run: |
          echo "=== Finding all gradlew files ==="
          find $FLUTTER_ROOT -name "gradlew" 2>/dev/null
          find bc_project -name "gradlew" 2>/dev/null

          echo "=== Patching ALL gradlew files found ==="
          for f in $(find $FLUTTER_ROOT -name "gradlew" 2>/dev/null) $(find bc_project -name "gradlew" 2>/dev/null); do
            echo "Patching: $f"
            sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS='"'"'-Xmx4096m -Xms512m'"'"'/' "$f"
            chmod +x "$f"
            grep "DEFAULT_JVM_OPTS" "$f"
          done

          echo "=== Setting up wrapper jar ==="
          mkdir -p bc_project/android/gradle/wrapper
          FLUTTER_JAR=$(find $FLUTTER_ROOT -name "gradle-wrapper.jar" 2>/dev/null | head -1)
          echo "Flutter jar: $FLUTTER_JAR"
          cp "$FLUTTER_JAR" bc_project/android/gradle/wrapper/gradle-wrapper.jar
          cp "$(find $FLUTTER_ROOT -name "gradle-wrapper.properties" 2>/dev/null | head -1)" \
             bc_project/android/gradle/wrapper/gradle-wrapper.properties
          ls -lh bc_project/android/gradle/wrapper/

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Run code generation
        working-directory: bc_project
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
