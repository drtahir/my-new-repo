name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties
          echo "flutter.versionCode=1" >> bc_project/android/local.properties
          echo "flutter.versionName=1.0.0" >> bc_project/android/local.properties

      - name: Fix Flutter internal gradlew
        run: |
          FLUTTER_GRADLEW="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew"
          FLUTTER_WRAPPER_DIR="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradle/wrapper"

          cat > "$FLUTTER_GRADLEW" << 'GRADLEW'
          #!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=`basename "$0"`
          DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'
          MAX_FD="maximum"
          warn() { echo "$*"; }
          die() { echo; echo "$*"; echo; exit 1; }
          if [ -z "$JAVA_HOME" ]; then
            JAVACMD="java"
          else
            JAVACMD="$JAVA_HOME/bin/java"
            if [ ! -x "$JAVACMD" ]; then die "ERROR: JAVA_HOME='$JAVA_HOME' but java not found."; fi
          fi
          SCRIPT_DIR=$(cd "$(dirname "$0")" && pwd)
          CLASSPATH="$SCRIPT_DIR/gradle/wrapper/gradle-wrapper.jar"
          exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x "$FLUTTER_GRADLEW"

          cp "$FLUTTER_GRADLEW" bc_project/android/gradlew
          chmod +x bc_project/android/gradlew

          mkdir -p bc_project/android/gradle/wrapper
          cp "$FLUTTER_WRAPPER_DIR/gradle-wrapper.jar" bc_project/android/gradle/wrapper/gradle-wrapper.jar
          cp "$FLUTTER_WRAPPER_DIR/gradle-wrapper.properties" bc_project/android/gradle/wrapper/gradle-wrapper.properties

          echo "=== Verification ==="
          grep "DEFAULT_JVM_OPTS" bc_project/android/gradlew
          ls -lh bc_project/android/gradle/wrapper/

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Run code generation
        working-directory: bc_project
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        working-directory: bc_project
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bc_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
