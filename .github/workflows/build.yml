name: Build Flutter APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > bc_project/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> bc_project/android/local.properties

      - name: Setup Gradle wrapper using Flutter jar
        run: |
          mkdir -p bc_project/android/gradle/wrapper
          JAR="bc_project/android/gradle/wrapper/gradle-wrapper.jar"

          # Find Flutter's own gradle-wrapper.jar
          echo "=== Searching Flutter for gradle-wrapper.jar ==="
          find $FLUTTER_ROOT -name "gradle-wrapper.jar" 2>/dev/null

          # Use Flutter's own jar - guaranteed compatible
          FLUTTER_JAR=$(find $FLUTTER_ROOT -name "gradle-wrapper.jar" 2>/dev/null | head -1)

          if [ -n "$FLUTTER_JAR" ]; then
            cp "$FLUTTER_JAR" "$JAR"
            echo "Copied from Flutter: $FLUTTER_JAR"
          else
            echo "Flutter jar not found! Searching entire system..."
            find / -name "gradle-wrapper.jar" 2>/dev/null | head -10
          fi

          echo "Jar size: $(wc -c < $JAR 2>/dev/null || echo 'FILE MISSING')"
          unzip -t "$JAR" > /dev/null 2>&1 && echo "JAR VALID" || echo "JAR INVALID"

          # Fix gradlew
          python3 << 'PYEOF'
          import re
          path = 'bc_project/android/gradlew'
          content = open(path).read()
          content = re.sub(r"DEFAULT_JVM_OPTS=.*", "DEFAULT_JVM_OPTS='-Xmx4096m -Xms512m'", content)
          open(path, 'w').write(content)
          for line in content.split('\n'):
              if 'DEFAULT_JVM_OPTS' in line:
                  print('PATCHED:', repr(line))
          PYEOF
          chmod +x bc_project/android/gradlew

          # Use wrapper properties matching Flutter's jar version
          FLUTTER_GRADLE_VER=$(find $FLUTTER_ROOT -name "gradle-wrapper.properties" 2>/dev/null | head -1)
          if [ -n "$FLUTTER_GRADLE_VER" ]; then
            echo "=== Flutter's gradle-wrapper.properties ==="
            cat "$FLUTTER_GRADLE_VER"
            cp "$FLUTTER_GRADLE_VER" bc_project/android/gradle/wrapper/gradle-wrapper.properties
          fi

          echo "=== Our gradle-wrapper.properties ==="
          cat bc_project/android/gradle/wrapper/gradle-wrapper.properties
          echo "=== gradlew DEFAULT_JVM_OPTS ==="
          grep "DEFAULT_JVM_OPTS" bc_project/android/gradlew
          echo "=== All wrapper files ==="
          ls -lh bc_project/android/gradle/wrapper/

      - name: Get Flutter dependencies
        working-directory: bc_project
        run: flutter pub get

      - name: Run code generation
        working-directory: bc_project
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Debug APK
        working-directory: bc_project
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bc_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
