name: Flutter Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: ⚠️ Remove old Flutter completely
        run: |
          sudo rm -rf /opt/hostedtoolcache/flutter
          rm -rf ~/.pub-cache
          rm -rf ~/.flutter

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: ☄️ Install Flutter 3.27.4 (no cache)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false
      
      - name: ✅ Verify correct Flutter version
        run: flutter --version
      
      - name: 🏗️ Build APK
        run: |
          cd bc_project
          flutter clean
          flutter build apk --debug
